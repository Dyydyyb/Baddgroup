<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="logixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="48" fill="#0b1324"/>
  <!-- Outer Hex/Shield geometry with glow -->
  <path d="M120 36 L192 78 L192 162 L120 204 L48 162 L48 78 Z" fill="none" stroke="url(#accentGlow)" stroke-width="4" opacity="0.4"/>
  <!-- Central Fleet Dynamic Icon -->
  <g filter="url(#shadow)">
    <path d="M72 136 L112 84 L144 122 L168 94" fill="none" stroke="url(#logixGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="136" r="8" fill="#38bdf8"/>
    <circle cx="112" cy="84" r="8" fill="#60a5fa"/>
    <circle cx="144" cy="122" r="8" fill="#818cf8"/>
    <circle cx="168" cy="94" r="10" fill="#a855f7"/>
  </g>
  <!-- Modern Speed Lines -->
  <path d="M64 162 H176" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M84 176 H156" stroke="rgba(255,255,255,0.1)" stroke-width="3" stroke-dasharray="6 6"/>
</svg>
