<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="aeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Technical Ring -->
  <circle cx="100" cy="100" r="92" fill="#0f172a" stroke="url(#aeroGrad)" stroke-width="4" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" stroke-dasharray="6,4" />
  
  <!-- Stylized Delta Wing / Supersonic Vector -->
  <path d="M100 28 L146 142 L100 124 L54 142 Z" fill="url(#aeroGrad)" filter="url(#glow)" />
  <path d="M100 36 L134 132 L100 118 L66 132 Z" fill="url(#wingGrad)" opacity="0.9" />
  
  <!-- Turbine Core & Airfoil Accents -->
  <circle cx="100" cy="116" r="14" fill="#0b1120" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="100" cy="116" r="6" fill="#38bdf8" />
  
  <!-- Horizontal Horizon Crosshair -->
  <line x1="26" y1="116" x2="48" y2="116" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <line x1="152" y1="116" x2="174" y2="116" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>
