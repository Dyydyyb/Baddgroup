<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <!-- Símbolo / Isotipo de Rayo Energético en 3 barras redondeadas naranja GTL -->
  <g transform="translate(10, 10)">
    <!-- Barra superior larga -->
    <line x1="20" y1="65" x2="65" y2="20" stroke="#FF7A00" stroke-width="14" stroke-linecap="round" />
    <!-- Barra media intermedia -->
    <line x1="38" y1="75" x2="62" y2="51" stroke="#FF7A00" stroke-width="14" stroke-linecap="round" />
    <!-- Barra inferior -->
    <line x1="32" y1="95" x2="72" y2="55" stroke="#FF7A00" stroke-width="14" stroke-linecap="round" />
  </g>

  <!-- Tipografía GTL -->
  <text x="110" y="72" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="2">GTL</text>
  
  <!-- Subtítulo INGENIERÍA ELÉCTRICA -->
  <text x="112" y="98" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing="4.5">INGENIERÍA ELÉCTRICA</text>
</svg>
