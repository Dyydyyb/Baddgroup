<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Cyan-Emerald de Alta Tecnología -->
    <linearGradient id="bgGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Gradiente Acento Neón -->
    <linearGradient id="bgGradAccent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Fondo Oscuro Obsidiana con brillo sutil -->
    <linearGradient id="bgDarkBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Filtro de Resplandor Neón -->
    <filter id="bgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Escudo / Base Hexagonal Facetada -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="url(#bgDarkBase)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5"/>
  <polygon points="50,10 86,29 86,71 50,90 14,71 14,29" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2"/>

  <!-- Letra 'B' Estilizada High-Tech -->
  <path d="M28 24 H48 C54.5 24 59 28 59 33.5 C59 37.5 56.5 41 52.5 42.5 C57.5 44 61 48 61 53.5 C61 60 55.5 64 48 64 H28 V24 Z" 
        fill="none" 
        stroke="url(#bgGradMain)" 
        stroke-width="5" 
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Trazo Central de la B -->
  <path d="M28 44 H48" stroke="url(#bgGradMain)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Acento Geométrico 'G' Integrado -->
  <path d="M72 40 V62 C72 68 66 73 58 73 H46" 
        fill="none" 
        stroke="url(#bgGradAccent)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <path d="M58 58 H72" stroke="url(#bgGradAccent)" stroke-width="4" stroke-linecap="round"/>

  <!-- Nodos de Red IA / Conexión Cuántica -->
  <circle cx="50" cy="14" r="3.5" fill="#38BDF8" filter="url(#bgGlow)"/>
  <circle cx="72" cy="40" r="3" fill="#10B981" filter="url(#bgGlow)"/>
  <circle cx="28" cy="24" r="3" fill="#38BDF8"/>
  <circle cx="28" cy="64" r="3" fill="#10B981"/>
</svg>
